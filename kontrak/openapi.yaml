          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/lot/masuk:
    get:
      tags:
      - lot
      summary: Lot Masuk
      description: '''Pilih dari daftar'' (§9.7) — kenyamanan demo di samping pencarian
        resi.


        K13: akun penerima yang masih terikat satu alamat tetap (data seed) dibatasi

        ke alamat itu; akun tanpa ikatan melihat semua lot yang sedang jalan, karena

        tujuan kini bebas dan kepemilikan ditentukan oleh nomor resi.'
      operationId: lot_masuk_api_lot_masuk_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BuktiLotOut'
                type: array
                title: Response Lot Masuk Api Lot Masuk Get
      security:
      - HTTPBearer: []
  /api/lot/qr/{kode_qr}:
    get:
      tags:
      - lot
      summary: Bukti Lot
      description: 'Bukti lot dari NOMOR RESI: foto muat, berat, waktu, transit berjalan
        vs ambang.


        K13: tidak ada lagi cek `lot.penerima_id == pengguna.penerima_id`. Tujuan
        kini

        bebas ditulis petani, jadi penerima tidak terikat satu alamat tetap —

        memegang nomor resi itu sendiri yang menjadi bukti berhak, persis seperti

        surat jalan sungguhan.'
      operationId: bukti_lot_api_lot_qr__kode_qr__get
      security:
      - HTTPBearer: []
      parameters:
      - name: kode_qr
        in: path
        required: true
        schema:
          type: string
          title: Kode Qr
      responses:
        '200':
          description: Successful Response

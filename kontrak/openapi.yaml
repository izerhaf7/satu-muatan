                title: Response Partisipasi Saya Api Partisipasi Saya Get
      security:
      - HTTPBearer: []
  /api/demo/reset:
    post:
      tags:
      - demo
      summary: Reset Demo
      description: 'Kembalikan database ke keadaan awal skenario demo (§11.2). Idempoten,

        deterministik — memanggil fungsi bersama `reset_ke_awal_demo` (Fase 3,

        `backend/seed/skenario_demo.py`) supaya CLI (`python seed/skenario_demo.py`)

        dan endpoint ini TIDAK PERNAH berbeda perilaku.


        Data transaksional dikosongkan KECUALI 8 slot riwayat SELESAI (spec §11.1
        —

        sumber grafik Dashboard Dampak); master (koperasi, penerima, komoditas,

        pengguna) + tier tetap utuh; konfigurasi dikembalikan ke nilai default seed.'
      operationId: reset_demo_api_demo_reset_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoResetOut'
  /api/demo/muatan/{slot_id}/berangkatkan:
    post:
      tags:
      - demo
      summary: Berangkatkan Demo
      description: 'K13 (tambahan demo): SATU tombol — tutup muatan → terbitkan resi
        → timbang

        otomatis → berangkat, supaya pelacakan bisa langsung didemokan tanpa mengetik

        berat & foto satu per satu di depan juri.


        Sengaja memanggil ulang handler sungguhan (`tutup_slot`, `selesai_muat`)

        supaya jalan pintas ini TIDAK PERNAH menyimpang dari alur asli — kalau alur

        aslinya berubah, jalan pintas ini ikut berubah dengan sendirinya.'
      operationId: berangkatkan_demo_api_demo_muatan__slot_id__berangkatkan_post
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoBerangkatOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /healthz:
    get:
      tags:
      - health
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:

            application/json:
              schema:
                $ref: '#/components/schemas/SerahTerimaOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/{slot_id}/pengiriman:

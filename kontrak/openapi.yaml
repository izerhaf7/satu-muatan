      operationId: healthz_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
components:
  schemas:
    AkunDemo:
      type: string
      enum:
      - PETUGAS
      - PETANI_WATI
      - PETANI_DEDI
      - PETANI_IJAH
      - PENERIMA_CIBIRU
      title: AkunDemo
      description: 'Akun demo (v2 §8). Tombol masuk cepat di layar Masuk untuk Petugas/Wati/

        Dedi/Penerima; Ijah masuk manual via nomor HP + PIN di skenario demo.'
    AlamatIn:
      properties:
        alamat:
          type: string
          maxLength: 300
          minLength: 1
          title: Alamat
        nama:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Nama
        telepon:
          anyOf:
          - type: string
            maxLength: 30
          - type: 'null'
          title: Telepon
        jalan:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Jalan
        rt_rw:
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
          title: Rt Rw
        desa:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Desa
        kecamatan:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Kecamatan
        kabupaten:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Kabupaten
        provinsi:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Provinsi
        kode_pos:
          anyOf:
          - type: string
            maxLength: 10
          - type: 'null'
          title: Kode Pos
        patokan:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Patokan
      type: object
      required:
      - alamat
      title: AlamatIn
      description: 'Alamat terstruktur mengikuti standar penulisan ekspedisi Indonesia
        (K14).


        Satu baris teks bebas tidak cukup untuk logistik sungguhan: kurir butuh nama

        & nomor telepon yang bisa dihubungi, komponen wilayah yang bisa dibaca

        terpisah, kode pos, dan patokan. Surat jalan pun mensyaratkan data pengirim

        dan penerima yang lengkap, bukan sekadar "Warung Bu Imas".


        Hanya `alamat` (ringkasan) yang wajib — sisanya boleh menyusul supaya petani

        tidak terkunci di formulir panjang saat sedang di kebun.'
    AlamatResolusiOut:
      oneOf:
      - required:
        - lat
        - lng
      - not:
          anyOf:
          - required:
            - lat
          - required:
            - lng
      properties:
        alamat_lengkap:
          anyOf:
          - type: string
            maxLength: 500
            minLength: 1
          - type: 'null'
          title: Alamat Lengkap
          description: Wajib bernilai untuk status OK dan KOORDINAT_TIDAK_PRESISI;
            null hanya untuk TIDAK_DITEMUKAN.
        jalan:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Jalan
        kode_pos:
          anyOf:
          - type: string
            maxLength: 10
          - type: 'null'
          title: Kode Pos
        desa:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Desa
        kecamatan:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Kecamatan
        kabupaten_kota:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Kabupaten Kota
        provinsi:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Provinsi
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
        lng:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lng
        granularitas:
          anyOf:
          - $ref: '#/components/schemas/GranularitasAlamat'
          - type: 'null'
        sumber:
          $ref: '#/components/schemas/SumberAlamat'
        status:
          $ref: '#/components/schemas/StatusResolusiAlamat'
        pesan:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Pesan
      type: object
      required:
      - alamat_lengkap
      - sumber
      - status
      title: AlamatResolusiOut
      description: Koordinat selalu berpasangan. Server juga menegakkan alamat_lengkap
        non-null berdasarkan status.
    AlamatResolusiRequest:
      properties:
        place_id:
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._~-]{0,255}$
          title: Place Id
          description: Token opaque dari `AlamatSaranOut`; berlaku untuk sumber GOOGLE
            maupun LOKAL.
      type: object
      required:
      - place_id
      title: AlamatResolusiRequest
    AlamatSaranBias:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
        lng:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lng
        radius_meter:
          type: number
          maximum: 50000.0
          exclusiveMinimum: 0.0
          title: Radius Meter
      type: object
      required:
      - lat
      - lng
      - radius_meter

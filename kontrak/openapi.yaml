  /api/lacak/resi/{kode_resi}:
    get:
      tags:
      - lacak
      summary: Perjalanan Resi
      description: 'K14: seluruh perjalanan satu resi — timeline, jejak posisi, dan
        telemetri.


        Otorisasinya RESI, bukan alamat. `pastikan_bisa_lihat_slot` untuk penerima

        masih membandingkan `pengguna.penerima_id` dengan tujuan muatan, dan K13

        membuat tujuan bebas — jadi jalur itu tidak lagi bisa dipakai penerima yang

        sah. Memegang nomor resi adalah buktinya, persis seperti surat jalan.'
      operationId: perjalanan_resi_api_lacak_resi__kode_resi__get
      security:
      - HTTPBearer: []
      parameters:
      - name: kode_resi
        in: path
        required: true
        schema:
          type: string
          title: Kode Resi
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerjalananResiOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pengiriman/{pengiriman_id}/majukan:
    post:
      tags:
      - lacak
      summary: Majukan Pengiriman
      description: 'Majukan state simulasi MockVendor satu langkah (K5) — deterministik,
        untuk demo.


        Mengembalikan `409 MUAT_BELUM_SELESAI` bila status slot belum `JALAN`; pelacakan

        tidak boleh dimulai sebelum proses muat selesai.'
      operationId: majukan_pengiriman_api_pengiriman__pengiriman_id__majukan_post
      security:
      - HTTPBearer: []
      parameters:
      - name: pengiriman_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pengiriman Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PengirimanOut'
        '409':
          description: MUAT_BELUM_SELESAI — status slot belum JALAN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pengiriman/{pengiriman_id}/geser:
    post:
      tags:
      - lacak
      summary: Geser Posisi
      description: 'K13: majukan POSISI kendaraan satu langkah sepanjang rute, bukan
        status.


        Tiap panggilan menulis satu titik `JejakPosisi` hasil interpolasi + satu

        sampel telemetri, sehingga peta benar-benar bergerak saat didemokan.

        Langkah terakhir menandai TIBA. Dipakai tombol "Majukan posisi" dan mode

        "jalan otomatis" di layar Lacak.


        Mengembalikan `409 MUAT_BELUM_SELESAI` bila status slot belum `JALAN`; pelacakan

        tidak boleh dimulai sebelum proses muat selesai.'
      operationId: geser_posisi_api_pengiriman__pengiriman_id__geser_post
      security:
      - HTTPBearer: []
      parameters:
      - name: pengiriman_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pengiriman Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PengirimanOut'
        '409':
          description: MUAT_BELUM_SELESAI — status slot belum JALAN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pengiriman/{pengiriman_id}/sampai:
    post:
      tags:
      - lacak
      summary: Tandai Sampai
      description: 'Tandai pengiriman tiba. Bila koordinat dikirim, server memvalidasi
        titik berada dalam `radius_sampai_m` dari tujuan.


        Mengembalikan `409 MUAT_BELUM_SELESAI` bila status slot belum `JALAN`, atau

        `409 SUDAH_TIBA` bila pengiriman sudah tiba.'
      operationId: sampai_pengiriman_api_pengiriman__pengiriman_id__sampai_post
      security:
      - HTTPBearer: []
      parameters:
      - name: pengiriman_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pengiriman Id
      requestBody:
        content:
          application/json:
            schema:
              properties:
                koordinat:
                  properties:
                    lat:
                      type: number
                      title: Lat
                    lng:
                      type: number
                      title: Lng
                  type: object
                  required:
                  - lat
                  - lng
                  title: Koordinat
              type: object
              title: SampaiRequest
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PengirimanOut'
        '409':
          description: MUAT_BELUM_SELESAI — status slot belum JALAN; SUDAH_TIBA — pengiriman sudah tiba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: BELUM_DI_TUJUAN — koordinat di luar radius_sampai_m dari tujuan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /api/slot/{slot_id}/berita-acara:
    get:
      tags:

openapi: 3.1.0
info:
  title: Satu Muatan API
  description: Sistem konsolidasi muatan & bukti mutu rantai pasok hortikultura.
  version: 0.1.0
paths:
  /api/auth/masuk:
    post:
      tags:
      - auth
      summary: Masuk
      description: Login nomor HP + PIN 6 digit (§9.1).
      operationId: masuk_api_auth_masuk_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasukRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/masuk-demo:
    post:
      tags:
      - auth
      summary: Masuk Demo
      description: 'Masuk cepat (demo) — hanya aktif saat DEMO_MODE (§9.1, K6: 6 akun).'
      operationId: masuk_demo_api_auth_masuk_demo_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasukDemoRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/saya:
    get:
      tags:
      - auth
      summary: Saya
      description: Profil pengguna yang sedang login.
      operationId: saya_api_auth_saya_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PenggunaOut'
      security:
      - HTTPBearer: []
  /api/komoditas:
    get:
      tags:
      - master
      summary: Daftar Komoditas
      operationId: daftar_komoditas_api_komoditas_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/KomoditasOut'
                type: array
                title: Response Daftar Komoditas Api Komoditas Get
      security:
      - HTTPBearer: []
  /api/penerima:
    get:
      tags:
      - master
      summary: Daftar Penerima
      operationId: daftar_penerima_api_penerima_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PenerimaOut'
                type: array
                title: Response Daftar Penerima Api Penerima Get
      security:
      - HTTPBearer: []
  /api/titik-kumpul/saya:
    get:
      tags:
      - master
      summary: Titik Kumpul Saya
      description: 'Titik kumpul milik pengguna login (titik awal rute). Rename v2
        §2: dulu /koperasi/saya.'
      operationId: titik_kumpul_saya_api_titik_kumpul_saya_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitikKumpulOut'
      security:
      - HTTPBearer: []
  /api/konfigurasi:
    get:
      tags:
      - panel-asumsi
      summary: Daftar Konfigurasi
      operationId: daftar_konfigurasi_api_konfigurasi_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/KonfigurasiOut'
                type: array
                title: Response Daftar Konfigurasi Api Konfigurasi Get
      security:
      - HTTPBearer: []
  /api/konfigurasi/{kunci}:
    patch:
      tags:
      - panel-asumsi
      summary: Ubah Konfigurasi
      operationId: ubah_konfigurasi_api_konfigurasi__kunci__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: kunci
        in: path
        required: true
        schema:
          type: string
          title: Kunci
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KonfigurasiPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KonfigurasiOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tier-kendaraan:
    get:
      tags:
      - panel-asumsi
      summary: Daftar Tier
      operationId: daftar_tier_api_tier_kendaraan_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TierKendaraanOut'
                type: array
                title: Response Daftar Tier Api Tier Kendaraan Get
      security:
      - HTTPBearer: []
  /api/tier-kendaraan/{tier_id}:
    patch:
      tags:
      - panel-asumsi
      summary: Ubah Tier
      operationId: ubah_tier_api_tier_kendaraan__tier_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: tier_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Tier Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TierKendaraanPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TierKendaraanOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/permintaan:
    get:
      tags:
      - permintaan
      summary: Daftar Permintaan
      description: 'Ter-scope per peran (K6): PENERIMA -> miliknya; PETUGAS (& lainnya)
        -> semua yang terbuka.'
      operationId: daftar_permintaan_api_permintaan_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PermintaanOut'
                type: array
                title: Response Daftar Permintaan Api Permintaan Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - permintaan
      summary: Buat Permintaan
      operationId: buat_permintaan_api_permintaan_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermintaanCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermintaanOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/kiriman:
    post:
      tags:
      - kiriman
      summary: Kirim Panen
      description: 'Kirim panen — sistem cocokkan ke muatan (baru atau yang sudah
        ada, §3.4).

        Menggantikan alur ''pilih slot → gabung'' untuk petani.'
      operationId: kirim_panen_api_kiriman_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KirimanCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KirimanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/kiriman/pratinjau:
    get:
      tags:
      - kiriman
      summary: Pratinjau
      description: 'Pratinjau §3.4 langkah 3: atap + potensi penghematan SEBELUM berkomitmen.'
      operationId: pratinjau_api_kiriman_pratinjau_get
      security:
      - HTTPBearer: []
      parameters:
      - name: volume_kg
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Volume Kg
      - name: lat
        in: query
        required: true
        schema:
          type: number
          title: Lat
      - name: lng
        in: query
        required: true
        schema:
          type: number
          title: Lng
      - name: tanggal
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Tanggal
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KirimanPratinjauResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot:
    get:
      tags:
      - slot
      summary: Daftar Slot
      description: 'Ter-scope per peran (K6): PETUGAS -> miliknya; PETANI -> slot
        titik kumpulnya;

        PENERIMA -> slot yang tujuannya memuat dirinya.'
      operationId: daftar_slot_api_slot_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/StatusSlot'
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlotItemOut'
                title: Response Daftar Slot Api Slot Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - slot
      summary: Buka Slot
      description: Buka slot baru (§9.3). Server menghitung urutan drop nearest-neighbor
        + jarak_km.
      operationId: buka_slot_api_slot_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotDetailOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/pratinjau:
    post:
      tags:
      - slot
      summary: Pratinjau Slot
      description: 'Pratinjau §9.3: jarak rute + tabel harga/kg pada berbagai skenario
        volume.'
      operationId: pratinjau_slot_api_slot_pratinjau_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PratinjauSlotRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PratinjauSlotResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/slot/{slot_id}:
    get:
      tags:
      - slot
      summary: Detail Slot
      description: 'LAYAR UTAMA DEMO (§9.4). Dipoll 3 detik — harga berjalan, partisipasi,

        rencana armada, waktu_server.'
      operationId: detail_slot_api_slot__slot_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotDetailOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/{slot_id}/gabung:
    post:
      tags:
      - slot
      summary: Gabung Slot
      description: '''Ikut kirim'' — mengunci harga_atap_per_kg petani (tidak pernah
        berubah).'
      operationId: gabung_slot_api_slot__slot_id__gabung_post
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GabungRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GabungResponse'
        '409':
          description: LUAPAN_KAPASITAS (§5.5) — dialog dua pilihan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LuapanKapasitasOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/{slot_id}/gabung/pratinjau:
    post:
      tags:
      - slot
      summary: Pratinjau Gabung
      description: 'Peringatan dini sebelum submit: atap, harga berjalan baru, potensi
        luapan.'
      operationId: pratinjau_gabung_api_slot__slot_id__gabung_pratinjau_post
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GabungPratinjauRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GabungPratinjauResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/{slot_id}/tutup:
    post:
      tags:
      - slot
      summary: Tutup Slot
      description: 'Cutoff (§5.4): tetapkan harga final + jaminan atap, kunci rencana
        armada,

        buat lot per partisipasi (alokasi penerima — K6), pesan ke vendor.'
      operationId: tutup_slot_api_slot__slot_id__tutup_post
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotDetailOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/{slot_id}/batal:
    post:
      tags:
      - slot
      summary: Batal Slot
      operationId: batal_slot_api_slot__slot_id__batal_post
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotDetailOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/{slot_id}/lot:
    get:
      tags:
      - lot
      summary: Daftar Lot Slot
      description: Daftar lot sebuah slot — layar Muat (§9.5).
      operationId: daftar_lot_slot_api_slot__slot_id__lot_get
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LotOut'
                title: Response Daftar Lot Slot Api Slot  Slot Id  Lot Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/lot/{lot_id}/muat:
    patch:
      tags:
      - lot
      summary: Muat Lot
      description: Timbang + foto + grade mutu 1–5 (input kunci atribusi 3-input,
        spec v2 §6).
      operationId: muat_lot_api_lot__lot_id__muat_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: lot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lot Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MuatPatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/{slot_id}/selesai-muat:
    post:
      tags:
      - lot
      summary: Selesai Muat
      description: Selesai muat -> slot JALAN, waktu berangkat tercatat (§9.5).
      operationId: selesai_muat_api_slot__slot_id__selesai_muat_post
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LotOut'
                title: Response Selesai Muat Api Slot  Slot Id  Selesai Muat Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/lot/masuk:
    get:
      tags:
      - lot
      summary: Lot Masuk
      description: '''Pilih dari daftar'' (§9.7, K6): lot menuju penerima login yang
        belum

        diserahterimakan — jalur demo teraman.'
      operationId: lot_masuk_api_lot_masuk_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BuktiLotOut'
                type: array
                title: Response Lot Masuk Api Lot Masuk Get
      security:
      - HTTPBearer: []
  /api/lot/qr/{kode_qr}:
    get:
      tags:
      - lot
      summary: Bukti Lot
      description: 'Bukti lot dari scan QR: foto muat, berat, waktu, transit berjalan
        vs ambang.'
      operationId: bukti_lot_api_lot_qr__kode_qr__get
      security:
      - HTTPBearer: []
      parameters:
      - name: kode_qr
        in: path
        required: true
        schema:
          type: string
          title: Kode Qr
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuktiLotOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/lot/{lot_id}/serah-terima:
    post:
      tags:
      - lot
      summary: Serah Terima
      description: Terima / Terima dengan potongan / Tolak -> atribusi + PENJELASAN
        (§6, §9.7).
      operationId: serah_terima_api_lot__lot_id__serah_terima_post
      security:
      - HTTPBearer: []
      parameters:
      - name: lot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lot Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SerahTerimaCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerahTerimaOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/{slot_id}/pengiriman:
    get:
      tags:
      - lacak
      summary: Pengiriman Slot
      description: Timeline + estimasi tiba (dari ambang transit) + jejak posisi.
      operationId: pengiriman_slot_api_slot__slot_id__pengiriman_get
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PengirimanOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/lacak/{slot_id}/telemetri:
    get:
      tags:
      - lacak
      summary: Telemetri Slot
      description: 'Sampel telemetri + ringkasan paparan (§5.3). Lazy-generate deterministik

        saat pertama dipanggil (SIMULASI, berlabel di UI).'
      operationId: telemetri_slot_api_lacak__slot_id__telemetri_get
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetriOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pengiriman/{pengiriman_id}/majukan:
    post:
      tags:
      - lacak
      summary: Majukan Pengiriman
      description: Majukan state simulasi MockVendor satu langkah (K5) — deterministik,
        untuk demo.
      operationId: majukan_pengiriman_api_pengiriman__pengiriman_id__majukan_post
      security:
      - HTTPBearer: []
      parameters:
      - name: pengiriman_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pengiriman Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PengirimanOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/{slot_id}/berita-acara:
    get:
      tags:
      - berita-acara
      summary: Berita Acara
      description: 'Agregat: lot + foto muat & bongkar, keputusan, atribusi, rincian
        ongkos

        per petani, selisih jaminan atap. Tanda tangan = garis kosong cetak (K4).'
      operationId: berita_acara_api_slot__slot_id__berita_acara_get
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      responses:

openapi: 3.1.0
info:
  title: Satu Muatan API
  description: Sistem konsolidasi muatan & bukti mutu rantai pasok hortikultura.
  version: 0.1.0
paths:
  /api/auth/masuk:
    post:
      tags:
      - auth
      summary: Masuk
      description: Login nomor HP + PIN 6 digit (§9.1).
      operationId: masuk_api_auth_masuk_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasukRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/daftar:
    post:
      tags:
      - auth
      summary: Daftar
      description: 'Daftar sendiri — Petani atau Penerima (§9.1 tambahan). PETUGAS
        sengaja

        tidak bisa daftar lewat sini (lihat `PeranDaftar`, hanya 2 nilai).


        Tanpa verifikasi OTP (keputusan produk) — nomor HP tidak dibuktikan

        kepemilikannya, cukup untuk demo. Auto-login setelah daftar, sama seperti

        `masuk()`.'
      operationId: daftar_api_auth_daftar_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DaftarRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/masuk-demo:
    post:
      tags:
      - auth
      summary: Masuk Demo
      description: 'Masuk cepat (demo) — hanya aktif saat DEMO_MODE (§9.1, K6: 6 akun).'
      operationId: masuk_demo_api_auth_masuk_demo_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasukDemoRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/saya:
    get:
      tags:
      - auth
      summary: Saya
      description: Profil pengguna yang sedang login.
      operationId: saya_api_auth_saya_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PenggunaOut'
      security:
      - HTTPBearer: []
  /api/aturan-kiriman:
    get:
      tags:
      - master
      summary: Aturan Kiriman
      description: 'K14: ambang kiriman untuk divalidasi di layar Kirim Panen — supaya
        petani

        tahu batasnya SEBELUM menekan tombol, bukan lewat galat 422 sesudahnya.'
      operationId: aturan_kiriman_api_aturan_kiriman_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AturanKirimanOut'
      security:
      - HTTPBearer: []
  /api/komoditas:
    get:
      tags:
      - master
      summary: Daftar Komoditas
      operationId: daftar_komoditas_api_komoditas_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/KomoditasOut'
                type: array
                title: Response Daftar Komoditas Api Komoditas Get
      security:
      - HTTPBearer: []
  /api/penerima:
    get:
      tags:
      - master
      summary: Daftar Penerima
      operationId: daftar_penerima_api_penerima_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PenerimaOut'
                type: array
                title: Response Daftar Penerima Api Penerima Get
      security:
      - HTTPBearer: []
  /api/titik-kumpul/saya:
    get:
      tags:
      - master
      summary: Titik Kumpul Saya
      description: 'Titik kumpul milik pengguna login (titik awal rute). Rename v2
        §2: dulu /koperasi/saya.'
      operationId: titik_kumpul_saya_api_titik_kumpul_saya_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitikKumpulOut'
      security:
      - HTTPBearer: []
  /api/wilayah/cari:
    get:
      tags:
      - alamat
      summary: Cari Wilayah
      description: 'Autocomplete daerah dari tabel `wilayah` (data Kemendagri, di-seed
        lokal).


        Yang diawali kata kunci diutamakan daripada yang sekadar mengandungnya —

        mengetik "cika" harus memunculkan Cikajang lebih dulu, bukan nama panjang

        yang kebetulan memuat potongan itu di tengah.'
      operationId: cari_wilayah_api_wilayah_cari_get
      security:
      - HTTPBearer: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          description: Potongan nama desa/kecamatan/kabupaten
          title: Q
        description: Potongan nama desa/kecamatan/kabupaten
      - name: batas
        in: query
        required: false
        schema:
          type: integer
          maximum: 30
          minimum: 1
          default: 10
          title: Batas
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WilayahOut'
                title: Response Cari Wilayah Api Wilayah Cari Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/wilayah/anak:
    get:
      tags:
      - alamat
      summary: Anak Wilayah
      operationId: anak_wilayah_api_wilayah_anak_get
      security:
      - HTTPBearer: []
      parameters:
      - name: tingkat
        in: query
        required: true
        schema:
          enum:
          - PROVINSI
          - KABUPATEN
          - KECAMATAN
          - DESA
          type: string
          title: Tingkat
      - name: induk_kode
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Induk Kode
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WilayahOut'
                title: Response Anak Wilayah Api Wilayah Anak Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/geokode/balik:
    get:
      tags:
      - alamat
      summary: Geokode Balik Endpoint
      description: 'Koordinat → alamat. Hasilnya di-cache per titik yang dibulatkan,
        jadi

        ketukan berulang di peta tidak pernah memanggil jaringan dua kali.'
      operationId: geokode_balik_endpoint_api_geokode_balik_get
      security:
      - HTTPBearer: []
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          title: Lat
      - name: lng
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          title: Lng
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeokodeOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/alamat/saran:
    post:
      tags:
      - alamat
      summary: Saran Alamat
      description: Cari paling banyak lima alamat untuk dipilih. `place_id` adalah
        token opaque yang hanya dikirim kembali ke `/api/alamat/resolusi`; browser
        tidak menerima URL, kunci, session token, atau objek mentah penyedia. Saat
        penyedia tidak tersedia, server dapat mengembalikan saran lokal atau respons
        tindakan aman untuk isian/peta manual.
      operationId: saran_alamat_api_alamat_saran_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlamatSaranRequest'
        required: true
      responses:
        '200':
          description: Saran alamat atau status fallback yang dapat ditindaklanjuti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlamatSaranListOut'
        '401':
          description: Bearer token tidak ada atau tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '429':
          description: Batas permintaan alamat tercapai; coba lagi setelah header
            Retry-After
          headers:
            Retry-After:
              description: Detik sampai klien boleh mencoba lagi.
              schema:
                type: integer
                minimum: 1.0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/alamat/resolusi:
    post:
      tags:
      - alamat
      summary: Resolusi Alamat
      description: Resolusi token `place_id` pilihan pengguna menjadi alamat terstruktur.
        Token lokal juga opaque dan diselesaikan server-side. `lat` dan `lng` selalu
        hadir bersama atau keduanya tidak ada; server menegakkan invarian lintas-field.
        Pada `KOORDINAT_TIDAK_PRESISI`, tampilkan pesan lalu minta pengguna memilih
        titik peta atau melengkapi alamat. `alamat_lengkap` wajib bernilai untuk `OK`
        dan `KOORDINAT_TIDAK_PRESISI`, dan null hanya untuk `TIDAK_DITEMUKAN`.
      operationId: resolusi_alamat_api_alamat_resolusi_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlamatResolusiRequest'
        required: true
      responses:
        '200':
          description: Alamat terstruktur dan status ketelitian koordinat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlamatResolusiOut'
        '401':
          description: Bearer token tidak ada atau tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '429':
          description: Batas permintaan alamat tercapai; coba lagi setelah header
            Retry-After
          headers:
            Retry-After:
              description: Detik sampai klien boleh mencoba lagi.
              schema:
                type: integer
                minimum: 1.0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/konfigurasi:
    get:
      tags:
      - panel-asumsi
      summary: Daftar Konfigurasi
      operationId: daftar_konfigurasi_api_konfigurasi_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/KonfigurasiOut'
                type: array
                title: Response Daftar Konfigurasi Api Konfigurasi Get
      security:
      - HTTPBearer: []
  /api/konfigurasi/{kunci}:
    patch:
      tags:
      - panel-asumsi
      summary: Ubah Konfigurasi
      operationId: ubah_konfigurasi_api_konfigurasi__kunci__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: kunci
        in: path
        required: true
        schema:
          type: string
          title: Kunci
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KonfigurasiPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KonfigurasiOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tier-kendaraan:
    get:
      tags:
      - panel-asumsi
      summary: Daftar Tier
      operationId: daftar_tier_api_tier_kendaraan_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TierKendaraanOut'
                type: array
                title: Response Daftar Tier Api Tier Kendaraan Get
      security:
      - HTTPBearer: []
  /api/tier-kendaraan/{tier_id}:
    patch:
      tags:
      - panel-asumsi
      summary: Ubah Tier
      operationId: ubah_tier_api_tier_kendaraan__tier_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: tier_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Tier Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TierKendaraanPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TierKendaraanOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/kiriman:
    post:
      tags:
      - kiriman
      summary: Kirim Panen
      description: 'Kirim panen — sistem cocokkan ke muatan (baru atau yang sudah
        ada, §3.4).

        Menggantikan alur ''pilih slot → gabung''.


        K14: hanya PETANI. Petugas adalah driver Satu Muatan — dia menjemput dan

        mengantar panen orang lain, bukan menyetorkan panennya sendiri.'
      operationId: kirim_panen_api_kiriman_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KirimanCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KirimanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/kiriman/pratinjau:
    get:
      tags:
      - kiriman
      summary: Pratinjau
      description: 'Pratinjau §3.4 langkah 3: atap + potensi penghematan SEBELUM berkomitmen.'
      operationId: pratinjau_api_kiriman_pratinjau_get
      security:
      - HTTPBearer: []
      parameters:
      - name: volume_kg
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Volume Kg
      - name: lat
        in: query
        required: true
        schema:
          type: number
          title: Lat
      - name: lng
        in: query
        required: true
        schema:
          type: number
          title: Lng
      - name: tanggal
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Tanggal
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KirimanPratinjauResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot:
    get:
      tags:
      - slot
      summary: Daftar Slot
      description: 'Ter-scope per peran (K6): PETUGAS -> miliknya; PETANI -> slot
        titik kumpulnya;

        PENERIMA -> slot yang tujuannya memuat dirinya.'
      operationId: daftar_slot_api_slot_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/StatusSlot'
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlotItemOut'
                title: Response Daftar Slot Api Slot Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/tersedia:
    get:
      tags:
      - slot
      summary: Slot Tersedia
      description: 'K14: PAPAN TUGAS — muatan yang belum punya driver dan berangkat
        dari titik

        kumpul petugas ini.


        K13 menugaskan driver otomatis saat muatan lahir, tanpa batas: satu petugas

        aktif menyerap SELURUH muatan di sistem, dan tidak ada satu pun endpoint yang

        bisa mengubahnya. Sekarang muatan menunggu diambil, dan pengambilan itu

        tindakan sadar driver.'
      operationId: slot_tersedia_api_slot_tersedia_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SlotItemOut'
                type: array
                title: Response Slot Tersedia Api Slot Tersedia Get
      security:
      - HTTPBearer: []
  /api/slot/{slot_id}/terima:
    post:
      tags:
      - slot
      summary: Terima Tugas
      description: 'K14: petugas mengambil satu muatan — dan HANYA satu dalam satu
        waktu.


        Batasnya dari konfigurasi (`maks_muatan_aktif_per_petugas`), bukan angka di

        kode (CLAUDE.md aturan #1). Sopir tidak bisa membawa dua truk sekaligus;

        membiarkannya menumpuk tugas membuat papan tugas jadi hiasan.'
      operationId: terima_tugas_api_slot__slot_id__terima_post
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotItemOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/{slot_id}:
    get:
      tags:
      - slot
      summary: Detail Slot
      description: 'LAYAR UTAMA DEMO (§9.4). Dipoll 3 detik — harga berjalan, partisipasi,

        rencana armada, waktu_server.'
      operationId: detail_slot_api_slot__slot_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotDetailOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/{slot_id}/gabung:
    post:
      tags:
      - slot
      summary: Gabung Slot
      description: '''Ikut kirim'' — mengunci harga_atap_per_kg petani (tidak pernah
        berubah).'
      operationId: gabung_slot_api_slot__slot_id__gabung_post
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GabungRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GabungResponse'
        '409':
          description: LUAPAN_KAPASITAS (§5.5) — dialog dua pilihan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LuapanKapasitasOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/{slot_id}/gabung/pratinjau:
    post:
      tags:
      - slot
      summary: Pratinjau Gabung
      description: 'Peringatan dini sebelum submit: atap, harga berjalan baru, potensi
        luapan.'
      operationId: pratinjau_gabung_api_slot__slot_id__gabung_pratinjau_post
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GabungPratinjauRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GabungPratinjauResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/{slot_id}/tutup:
    post:
      tags:
      - slot
      summary: Tutup Slot
      description: 'Cutoff (§5.4): tetapkan harga final + jaminan atap, kunci rencana
        armada,

        buat lot per partisipasi (alokasi penerima — K6), pesan ke vendor.'
      operationId: tutup_slot_api_slot__slot_id__tutup_post
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotDetailOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/{slot_id}/batal:
    post:
      tags:
      - slot
      summary: Batal Slot
      operationId: batal_slot_api_slot__slot_id__batal_post
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotDetailOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/{slot_id}/lot:
    get:
      tags:
      - lot
      summary: Daftar Lot Slot
      description: Daftar lot sebuah slot — layar Muat (§9.5).
      operationId: daftar_lot_slot_api_slot__slot_id__lot_get
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Slot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LotOut'
                title: Response Daftar Lot Slot Api Slot  Slot Id  Lot Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/lot/{lot_id}/muat:
    patch:
      tags:
      - lot
      summary: Muat Lot
      description: Timbang + foto + grade mutu 1–5 (input kunci atribusi 3-input,
        spec v2 §6).
      operationId: muat_lot_api_lot__lot_id__muat_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: lot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lot Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MuatPatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/slot/{slot_id}/selesai-muat:
    post:
      tags:
      - lot
      summary: Selesai Muat
      description: Selesai muat -> slot JALAN, waktu berangkat tercatat (§9.5).
      operationId: selesai_muat_api_slot__slot_id__selesai_muat_post
      security:
      - HTTPBearer: []
      parameters:
      - name: slot_id

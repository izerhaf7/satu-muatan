            application/json:
              schema:
                $ref: '#/components/schemas/BuktiLotOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/lot/{lot_id}/serah-terima:
    post:
      tags:
      - lot
      summary: Serah Terima
      description: 'Terima / Tolak -> atribusi + PENJELASAN (§6, §9.7).


        K13: berhak menerima = memegang nomor resinya (lihat `bukti_lot`).

        K14: tidak ada lagi "terima dengan potongan", dan TOLAK hanya sah kalau

        penurunan mutu yang DIUKUR SISTEM melewati ambang. Aturan itu ditegakkan di

        sini, bukan cuma disembunyikan tombolnya — klien tidak boleh dipercaya.'
      operationId: serah_terima_api_lot__lot_id__serah_terima_post
      security:
      - HTTPBearer: []
      parameters:
      - name: lot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lot Id
      requestBody:
        required: true
        content:

        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/dampak/ringkasan:
    get:
      tags:
      - dampak
      summary: Dampak Ringkasan
      description: 4 kartu, masing-masing dengan rumus + status_sumber. Tanpa data
        = null -> '—'.
      operationId: dampak_ringkasan_api_dampak_ringkasan_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DampakRingkasanOut'
      security:
      - HTTPBearer: []
  /api/dampak/bulanan:
    get:
      tags:
      - dampak
      summary: Dampak Bulanan
      description: Grafik batang per bulan (Recharts) — termasuk jumlah_kiriman (K6).
      operationId: dampak_bulanan_api_dampak_bulanan_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DampakBulananOut'
                type: array
                title: Response Dampak Bulanan Api Dampak Bulanan Get
      security:
      - HTTPBearer: []
  /api/partisipasi/saya:
    get:
      tags:
      - riwayat
      summary: Partisipasi Saya
      description: Riwayat ikut kirim + kembalian milik petani login.
      operationId: partisipasi_saya_api_partisipasi_saya_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PartisipasiRiwayatOut'
                type: array
                title: Response Partisipasi Saya Api Partisipasi Saya Get
      security:
      - HTTPBearer: []
  /api/demo/reset:
    post:
      tags:
      - demo
      summary: Reset Demo
      description: 'Kembalikan database ke keadaan awal skenario demo (§11.2). Idempoten,

        deterministik — memanggil fungsi bersama `reset_ke_awal_demo` (Fase 3,

        `backend/seed/skenario_demo.py`) supaya CLI (`python seed/skenario_demo.py`)

        dan endpoint ini TIDAK PERNAH berbeda perilaku.


        Data transaksional dikosongkan KECUALI 8 slot riwayat SELESAI (spec §11.1
        —

        sumber grafik Dashboard Dampak); master (koperasi, penerima, komoditas,

        pengguna) + tier tetap utuh; konfigurasi dikembalikan ke nilai default seed.'
      operationId: reset_demo_api_demo_reset_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoResetOut'
  /healthz:
    get:
      tags:
      - health
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
